<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .forgot-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0c79f5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:disabled {
            background-color: #a0c4f5;
            cursor: not-allowed;
        }

        button:hover:enabled {
            background-color: #247fd9;
        }

        #countdown {
            text-align: center;
            color: red;
            font-size: 13px;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="forgot-box">
    <h1>Forgot Password</h1>

    {% if error %}
        <div id="errorMsg" style="color: red; font-size: 14px; margin-bottom: 10px;">
            {{ error }} <span id="countdown" style="font-weight: bold;"></span>
        </div>
    {% endif %}

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success" style="color: rgb(32, 216, 22); font-size: 14px; margin-bottom: 10px;">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" id="forgotForm">
        {% csrf_token %}
        <label for="email">Enter your registered email</label>
        <input type="email" id="email" name="email" required />
        <button type="submit" id="sendBtn">Send Reset Link</button>
        <a href="/login/">click here to Login?</a>
        
    </form>

    <div class="footer">
        &copy; 2025 Casualio
    </div>
</div>

</body>
</html>
