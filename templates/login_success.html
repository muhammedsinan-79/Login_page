<!-- login_success.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Casualio</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 15px 30px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .header h2 {
            margin: 0;
            color: #2c7be5;
        }

        .logout-button {
            padding: 8px 16px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .logout-button:hover {
            background-color: #c0392b;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        .todo-header {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .todo-item {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }
    </style>
    
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h3>Welcome, {{ email }}</h3>
        <h3>Your token , {{ token }}</h3>
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>

    <!-- Main Container -->
    <div class="container">

        <tabel>
            <tr>
                <th>📝 Your ToDo List</th>
                <th>Description</th>
            </tr>

        </tabel>
        

        <!-- ToDo Items -->
        <div class="todo-item"> Finish Django Throttling</div>
        <div class="todo-item"> Test Postman Requests</div>
        <div class="todo-item"> Set up Redis or MySQL logs</div>

    </div>

    <div class="footer">&copy; 2025 Casualio</div>

    <!-- JS -->
    <script>
        localStorage.setItem('authToken', '{{ token }}');

        function logout() {
            const token = localStorage.getItem('authToken');

            fetch('http://127.0.0.1:8000/logout/', {
                method: 'POST',
                headers: {
                    'Authorization': 'Token ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    alert('Logged out successfully!');
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                } else {
                    alert('Logout failed!');
                }
            })
            .catch(error => {
                console.error('Logout error:', error);
            });
        }
    </script>
</body>
</html>
